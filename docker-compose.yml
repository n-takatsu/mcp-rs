# ========================================
# Docker Compose Configuration for mcp-rs
# ========================================

services:
  # Main MCP Server (HTTP mode)
  #
  # mcp-rs reads ./config/mcp-config.toml. For HTTP mode in a container, it
  # must listen on all interfaces, accept connections from outside the
  # container, and require an API key:
  #
  #   [server]
  #   log_level = "info"
  #
  #   [transport]
  #   type = "http"
  #
  #   [transport.http]
  #   addr = "0.0.0.0"
  #   port = 8081
  #   network_policy_reject_external_connections = false
  #   auth_enabled = true
  #
  #   [[transport.http.api_keys]]
  #   key = "${MCP_API_KEY}"      # from the environment below (v0.24.0+)
  #   name = "client"
  #   user_id = "user-1"
  #
  #   [handlers]
  #
  # See docs/DOCKER_GUIDE.md.
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-rs:latest
    container_name: mcp-server
    restart: unless-stopped

    # Security settings
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M

    # Ports (only on this machine; put a TLS proxy in front to expose it)
    ports:
      - "127.0.0.1:8081:8081"

    volumes:
      # Config file (read-only)
      - ./config:/app/config:ro
      # Logs and the audit log go under /home/nonroot (the root filesystem
      # is read-only). The named volume keeps them when the container is
      # recreated: Docker copies /home/nonroot from the image, owned by
      # nonroot, into the volume when it is first used.
      - mcp-state:/home/nonroot
    tmpfs:
      - /tmp

    # Pass secrets used as ${VAR} in the config file here, e.g.
    # environment:
    #   MCP_API_KEY: ${MCP_API_KEY}
    #   WORDPRESS_PASSWORD: ${WORDPRESS_PASSWORD}

    # Networks
    networks:
      - mcp-network

  # PostgreSQL Database (optional). To give mcp-rs its database tools, add a
  # [database] section to the config file with host = "postgres"; see
  # website/docs/guides/postgres-integration.md for a read-only role.
  postgres:
    image: postgres:16-alpine
    container_name: mcp-postgres
    restart: unless-stopped

    # Security settings
    security_opt:
      - no-new-privileges:true

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcp_db}
      POSTGRES_USER: ${POSTGRES_USER:-mcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - mcp-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcp_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  mcp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mcp-state:
    driver: local
  postgres-data:
    driver: local
