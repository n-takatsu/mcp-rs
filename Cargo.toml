[package]
name = "mcp-rs"
version = "0.30.0"
edition = "2021"
# 最小対応のRustのバージョン（MSRV、#516）。DockerfileのFROM rust:X.Yも
# 同じにする（CIで一致を確かめる）。上げるときは両方を同じPRで変える
rust-version = "1.98"
# MSRVを考慮して依存クレートを選ぶ（cargo updateが、rust-versionより
# 新しいRustを要求する版を避ける）
resolver = "3"
authors = ["n-takatsu"]
description = "Rust implementation of the Model Context Protocol (MCP) server for WordPress and other tools"
license = "MIT OR Apache-2.0"
repository = "https://github.com/n-takatsu/mcp-rs"
homepage = "https://n-takatsu.github.io/mcp-rs/"

[dependencies]
# Core async runtime
tokio = { version = "1.54", features = ["full"] }
futures = "0.3.31"

# Web framework and HTTP
axum = { version = "0.8", features = ["ws"] }
tower = "0.5.2"
tower-http = { version = "0.6", features = ["cors", "timeout", "trace"] }
hyper-util = { version = "0.1", features = ["server", "service", "http1", "http2", "tokio"] }
# 接続の何もしていない時間を数えるため、応答の本文を包む（#592）
hyper = { version = "1", features = ["server", "http1", "http2"] }
http-body-util = "0.1"
http = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
# preserve_order: mcp-rs initが写す設定ファイルの順番を、前のファイルと同じにする（#602）
toml = { version = "0.9.8", features = ["preserve_order"] }
# [database]を、コメントを残したまま書き換える（database-keyring、#628）
toml_edit = "0.23.9"

# Database and storage (PostgreSQL and SQLite only - MySQL via mysql_async)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "chrono", "uuid", "json", "migrate"], default-features = false }
# SQL parsing for resolving result columns back to their source table/column.
# "visitor" enables recursive AST walking so table references nested inside
# subqueries (WHERE/SELECT-list/HAVING, not just top-level FROM/JOIN) can be
# found reliably instead of missed by a hand-rolled, easy-to-miss-a-case walk.
sqlparser = { version = "0.62", optional = true, features = ["visitor"] }
# MySQL ([database] engine = "mysql", #527). TLS uses rustls with the ring
# provider, as the HTTP server does, so no OpenSSL is needed. The default
# features had no TLS at all
mysql_async = { version = "0.37", optional = true, default-features = false, features = ["default-rustls-ring"] }
# Not used directly. Sets the lower bound of mysql_async's lru (which allows
# 0.18.0) to the version that fixes RUSTSEC-2026-0253
lru = { version = "0.18.2", optional = true }
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots", "tls-rustls-insecure", "connection-manager"], optional = true }
# MongoDB support
mongodb = { version = "3.6", default-features = false, features = ["compat-3-0-0", "rustls-tls"], optional = true }

# Date and time
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["macros", "serde"] }

# UUID generation
uuid = { version = "1.18", features = ["v4", "serde"] }

# Random number generation (for benchmarks and testing)
rand = "0.8"

# Cryptography and security
ring = "0.17.14"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22.1"
secrecy = { version = "0.10.3", features = ["serde"] }
zeroize = "1.8.2"
# OS credential store for WordPress credentials (#533): Windows Credential
# Manager, macOS Keychain, Secret Service on Linux (pure-Rust zbus, no libdbus).
# Behind the os-keyring feature
keyring = { version = "4.2.0", optional = true }
# zeroize (#543): aes overwrites the expanded AES round keys with zeros when
# dropped. aes-gcm's own feature only clears a temporary copy of the GHASH
# key while it is built, and does not reach aes, so aes (the 0.8 used by
# aes-gcm 0.10) is listed only to turn its feature on
aes-gcm = { version = "0.10", features = ["zeroize"] }
aes = { version = "0.8", features = ["zeroize"] }
pbkdf2 = "0.12"
sha2 = "0.10"

# mTLS and Certificate Management
rustls = { version = "0.23", features = ["std"] }
rustls-pemfile = "2.2"
tokio-rustls = "0.26"

# Network and IP handling
ipnet = "2.11"

# Logging and tracing
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json", "chrono"] }
tracing-appender = "0.2.3"
# `log`クレートの記録を`tracing`に流す（tracing-subscriberの`try_init`が使うものと同じ。PR #770）
tracing-log = "0.2"

# Configuration
config = "0.15.18"

# Error handling
thiserror = "2.0.17"
anyhow = "1.0.100"
async-trait = "0.1.89"

# HTTP client
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }

# Validation
regex = "1.12"
url = "2.5.9"
urlencoding = "2.1"
ammonia = "4.1.9"

# WebSocket
tungstenite = "0.28"
# wss:// client uses rustls (the same TLS stack as the HTTP/WebSocket server
# side) instead of native-tls, so OpenSSL is not needed on Linux (#448)
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# TUI and terminal handling
crossterm = "0.27"
# ratatui = { version = "0.29", optional = true, default-features = false }
# tui-input = { version = "0.8", optional = true }

jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
# O_NOFOLLOW for the log files (#543). Already in Cargo.lock through other
# crates
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Windowsで、設定ファイルと控えを本人だけが使えるACLで作る（#674）.
# Already in Cargo.lock through other crates
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
# HTTP/2のクライアント（何もしていない接続を閉じるテスト、#592）
hyper = { version = "1", features = ["client", "http2"] }
# Testing framework
tokio-test = "0.4.4"
# Test certificates for the HTTPS/mTLS tests (src/transport/http.rs)
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
tempfile = "3.23"
# Used by tests/database
log = "0.4"
env_logger = "0.11"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

# Optional heavy dependencies (commented out to reduce CI load)
# proptest = "1.9"
# fake = { version = "4.4", features = ["derive", "chrono", "uuid"] }
# rand = "0.8.5"

[features]
default = ["database", "mysql-backend", "redis-backend", "mongodb-backend", "os-keyring"]

# `keyring = "<name>"` in [handlers.wordpress] and `mcp-rs wordpress-keyring`
# (#533). On by default for desktop use. The Docker image leaves it out: a
# container has no OS credential store
os-keyring = ["dep:keyring"]

# Database handler: [database] in the config file (PostgreSQL, #453).
# On by default, so release builds and the Docker image include it. Build
# with --no-default-features to leave it out (and mysql-backend with it)
database = ["postgresql-backend", "dep:sqlparser"]

# Storage backends
# Redis engine: engine = "redis" in [database] (#529). On by default, so
# release builds and the Docker image include it
redis-backend = ["database", "redis"]
# The MySQL engine is part of the database handler code. On by default
# (#527), so release builds and the Docker image can use engine = "mysql"
mysql-backend = ["database", "mysql_async", "dep:lru"]
postgresql-backend = []
# The SQLite engine (#528) is always built, as sqlx always has SQLite. Only
# tests/database/sqlite_integration_tests.rs checks this feature
sqlite = []
# MongoDB engine: engine = "mongodb" in [database] (#530). On by default, so
# release builds and the Docker image include it
mongodb-backend = ["database", "mongodb"]

# No code checks this feature; kept because CI and scripts/run-integration-tests.*
# pass --features integration-tests
integration-tests = []

[profile.dev]
opt-level = 0
# Line numbers only: panic backtraces keep file/line, but full debuginfo
# made every example/test .pdb ~400MB (target/debug grew to ~70GB, #371).
# For debugger variable inspection, set CARGO_PROFILE_DEV_DEBUG=true locally.
debug = "line-tables-only"
overflow-checks = true
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.test]
opt-level = 0
debug = false
incremental = true

[profile.bench]
opt-level = 3
debug = false
lto = true

# Data masking examples require the database feature
