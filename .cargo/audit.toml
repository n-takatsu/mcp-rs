# Cargo audit configuration for mcp-rs

[advisories]
# Ignore advisories for dependencies that:
# 1. Have no fix available yet
# 2. Are not directly exploitable in our use case
# 3. Are in optional/development dependencies

ignore = [
    # RUSTSEC-2023-0071: RSA Marvin Attack
    # - Affects: rsa 0.9.9 (via sqlx-mysql, jsonwebtoken)
    # - Status: No fixed version available
    # - Mitigation: jsonwebtoken uses rust-crypto backend (safe)
    #               MySQL connection uses TLS (additional layer)
    "RUSTSEC-2023-0071",
    
    # RUSTSEC-2025-0134: rustls-pemfile unmaintained
    # - Affects: rustls-pemfile 2.2.0 (via kube-client)
    # - Status: Unmaintained warning
    # - Mitigation: Only used in optional Kubernetes feature
    #               Not exposed in default configuration
    "RUSTSEC-2025-0134",

    # RUSTSEC-2025-0012: backoff unmaintained
    # - Affects: backoff 0.4.0 (via async-openai)
    # - Status: Unmaintained warning
    # - Mitigation: async-openai is optional (llm-integration feature)
    #               Track upstream replacement before enabling by default
    "RUSTSEC-2025-0012",

    # RUSTSEC-2024-0384: instant unmaintained
    # - Affects: instant 0.1.13 (transitive via backoff)
    # - Status: Unmaintained warning
    # - Mitigation: Only present through optional llm-integration dependency chain
    "RUSTSEC-2024-0384",

    # RUSTSEC-2024-0436: paste unmaintained
    # - Affects: paste 1.0.15 (via statrs -> nalgebra -> simba)
    # - Status: Unmaintained warning
    # - Mitigation: Only used by optional ml-anomaly-detection feature
    "RUSTSEC-2024-0436",

    # RUSTSEC-2026-0118: hickory-proto NSEC3 closest-encloser proof validation unbounded loop
    # - Affects: hickory-proto (all versions including 0.26.1)
    # - Status: No fixed upgrade is available
    # - Mitigation: mcp-rs uses hickory-resolver for DNS resolution only (no DNSSEC validation)
    #               NSEC3 processing path is not invoked in typical stub resolver usage
    "RUSTSEC-2026-0118",

    # RUSTSEC-2026-0119: hickory-proto CPU exhaustion due to O(n²) name compression
    # - Affects: hickory-proto 0.25.2 via mongodb 3.6.0 (transitive dependency)
    # - Status: Fixed in >= 0.26.1; direct dependency updated, but mongodb pins 0.25.2 internally
    # - Mitigation: mongodb is optional (mongodb-backend feature); message encoding path
    #               is not exposed externally; track mongodb release with updated hickory
    "RUSTSEC-2026-0119",

    # RUSTSEC-2026-0173: proc-macro-error2 is unmaintained
    # - Affects: proc-macro-error2 2.0.1 (via validator, mysql_async transitive)
    # - Status: Unmaintained but no critical functionality loss
    # - Mitigation: validator and mysql_async are stable; proc-macro-error2 only used for derive macro code gen
    "RUSTSEC-2026-0173",

    # RUSTSEC-2026-0097: Rand is unsound with a custom logger using `rand::rng()`
    # - Affects: rand 0.8.5, 0.9.2 (transitive via redis, tokio-retry, sqlx, smartcore, tungstenite, etc.)
    # - Status: Design flaw; requires custom logger + rand::rng() to trigger (not default usage)
    # - Mitigation: mcp-rs does not use rand::rng() with custom logger; default usage is safe
    #               Upgrading rand across entire ecosystem is infeasible due to multiple major consumers
    "RUSTSEC-2026-0097",

    # RUSTSEC-2026-0387: crypto-bigint timing variability in constant-time ops
    # - Affects: crypto-bigint 0.5.5 (via elliptic-curve -> p256/p384 -> jsonwebtoken)
    # - Status: Fix requires crypto-bigint >=0.7.6, only available via jsonwebtoken
    #           11.x (breaking major version bump from our pinned 10.2)
    # - Mitigation: Evaluate jsonwebtoken 11.x migration separately; timing
    #               side-channel requires an attacker able to measure
    #               microarchitectural timing of our JWT signing/verification
    "RUSTSEC-2026-0387",

    # RUSTSEC-2026-0459: libsqlite3-sys bundles SQLite < 3.54.0 (CVE-2026-119375)
    # - Affects: libsqlite3-sys 0.30.1 (via sqlx-sqlite 0.8.6, the "sqlite" feature of sqlx)
    # - Status: No fixed upgrade is available. The fix is libsqlite3-sys >= 0.39.0,
    #           but sqlx-sqlite 0.8.6 and 0.9.0 (latest) both require < 0.38.0
    # - Mitigation: Only a process that opens a database file and its -wal file
    #               written by a less trusted party is exposed (local attack).
    #               The default build does not open SQLite: the SQLite engine is
    #               only in the optional "database" feature, and the database
    #               path comes from the operator's own config file
    # - Remove this entry when sqlx allows libsqlite3-sys >= 0.39.0 (#449)
    "RUSTSEC-2026-0459",

]
