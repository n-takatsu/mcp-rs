# mcp-rs: Claude Desktop and Claude Code (STDIO)
#
# The client starts mcp-rs and talks to it over standard input and output.
# mcp-rs writes its log to a file and to standard error, never to standard
# output. Start it with an absolute path:
#
#   mcp-rs --config /path/to/claude-desktop.toml
#
# Up to v0.23.0, this file also had sections that mcp-rs did not read
# ([filesystem], [security], [logging], and others, #557). There is no
# filesystem handler in mcp-rs: to let the AI client read files, add an MCP
# filesystem server as a plugin ([[plugins]], see configs/examples/multi-handler.toml).

[server]
log_level = "warn"

[transport]
type = "stdio"

# WordPress. As it is, this reads three environment variables:
# WORDPRESS_URL, WORDPRESS_USERNAME, and WORDPRESS_PASSWORD. Claude Desktop
# does not pass the OS environment variables, so write all three in the env
# of claude_desktop_config.json.
#
# With the OS credential store instead of environment variables, Claude
# Desktop, Claude Code, and a terminal all read the same place. Register with
# `mcp-rs wordpress-keyring set your-site`, copy this file, remove the
# username and password lines, and write:
#   url = "https://your-wordpress-site.com"
#   keyring = "your-site"
[handlers.wordpress]
enabled = true                          # required: without it, the WordPress tools are not registered
url = "${WORDPRESS_URL}"
username = "${WORDPRESS_USERNAME}"
password = "${WORDPRESS_PASSWORD}"      # WordPress Application Password
timeout_seconds = 30

[handlers.wordpress.rate_limit]
enabled = true
requests_per_second = 10
burst_size = 20
