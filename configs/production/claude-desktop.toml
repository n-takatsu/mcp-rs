# MCP-RS Claude Desktop Configuration v0.15.1
#
# 🚨 重要: Claude DesktopはSTDIO通信のため、標準出力にログが混在すると動作しません
# この設定ではログをファイルのみに出力し、STDIOをJSON通信専用にします

[server]
name = "mcp-rs-claude"
version = "0.15.1"
# STDIO通信設定（Claude Desktop必須）
stdio = true
# ログレベルを制限（ERROR以上のみコンソール出力）
log_level = "warn"

[transport]
type = "stdio"

# STDIO Transport設定（Claude Desktop専用）
[transport.stdio]
buffer_size = 8192
timeout_ms = 30000
content_length_header = true
framing_method = "content-length"
max_message_size = 1048576
pretty_print = false

# HTTP設定は無効（Claude DesktopはHTTP未対応）
[transport.http]
addr = "127.0.0.1"
port = 8081
cors_enabled = false

# 必須: ハンドラー設定
[handlers]
enabled = ["filesystem"]

# ファイルシステムハンドラー（Claude Desktop用：読み取り専用）
[filesystem]
root_path = "."
read_only = true

# WordPress設定（オプション）
# 注意: src/config.rs の WordPressConfig 構造体は
#   [handlers.wordpress] テーブル配下の url / username / password (必須),
#   enabled / timeout_seconds / rate_limit のみを認識します。
#   （cache / retry / max_posts などのキーは現バージョンでは未実装のため無視されます）
[handlers.wordpress]
enabled = true
url = "${WORDPRESS_URL}"
username = "${WORDPRESS_USERNAME}"
password = "${WORDPRESS_PASSWORD}"                      # WordPress Application Password（環境変数推奨）
timeout_seconds = 30

[handlers.wordpress.rate_limit]
enabled = true
requests_per_second = 10
burst_size = 20

# セキュリティ設定
[security]
enable_auth = false
allowed_hosts = ["127.0.0.1", "localhost"]
max_connections = 100
connection_timeout_ms = 30000

[security.rate_limiting]
enabled = true
requests_per_minute = 100
burst_size = 20

# ログ設定
[logging]
level = "warn"
file_path = "logs/mcp-rs-claude.log"
format = "json"
include_timestamp = true
include_caller = false

[logging.file]
enabled = false
path = "mcp-rs.log"
max_size_mb = 10
max_files = 5
rotate_daily = true
