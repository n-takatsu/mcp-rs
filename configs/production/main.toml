# mcp-rs: the smallest STDIO configuration
#
# Without any handler, mcp-rs offers only mcp_rs_status. Uncomment
# [handlers.wordpress], or add [database] or [[plugins]]
# (see configs/examples/multi-handler.toml).
#
# Up to v0.23.0, this file had a "filesystem handler" and other sections
# that mcp-rs did not read (#557). There is no filesystem handler in mcp-rs.

[server]
log_level = "info"

[transport]
type = "stdio"

# Required, even when empty
[handlers]

# WordPress (credentials from environment variables)
# [handlers.wordpress]
# enabled = true
# url = "${WORDPRESS_URL}"
# username = "${WORDPRESS_USERNAME}"
# password = "${WORDPRESS_PASSWORD}"
# timeout_seconds = 30

# Audit log of every tool call. Default: in the user folder, see
# https://n-takatsu.github.io/mcp-rs/docs/security/#audit-log
# [audit]
# file_path = "/path/to/audit.log"
