# mcp-rs: HTTP, for web clients on this machine
#
# The endpoint is http://127.0.0.1:8081/mcp (and ws://127.0.0.1:8081/ws with
# enable_websocket_upgrade). It listens on loopback only. To listen on the
# network, authentication is required: see
# https://n-takatsu.github.io/mcp-rs/docs/security/
#
# Up to v0.23.0, this file had a "filesystem handler", [security], [logging],
# and keys under [transport.http] that mcp-rs did not read (#557).

[server]
log_level = "info"

[transport]
type = "http"

[transport.http]
addr = "127.0.0.1"
port = 8081
enable_cors = true
max_request_size = 1048576              # bytes of a request body
request_timeout_seconds = 30
# A web app served from another origin than localhost must be listed:
# allowed_origins = ["https://app.example.com"]
# enable_websocket_upgrade = true       # also accept MCP on /ws

[handlers.wordpress]
enabled = true
url = "${WORDPRESS_URL}"
username = "${WORDPRESS_USERNAME}"
password = "${WORDPRESS_PASSWORD}"
timeout_seconds = 30

[handlers.wordpress.rate_limit]
enabled = true
requests_per_second = 10
burst_size = 20
