# mcp-rs: connect to a PostgreSQL database (#453)
#
# Copy this section into your mcp-rs configuration file. MCP clients then get
# the tools execute_query and get_schema (read-only). See
# https://n-takatsu.github.io/mcp-rs/docs/database/
#
# Connect with a role that can only read what the AI client should see:
#   CREATE ROLE mcp_reader LOGIN PASSWORD '...';
#   GRANT CONNECT ON DATABASE app TO mcp_reader;
#   GRANT USAGE ON SCHEMA public TO mcp_reader;
#   GRANT SELECT ON ALL TABLES IN SCHEMA public TO mcp_reader;

[database]
engine = "postgresql"
host = "localhost"
port = 5432
database = "app"
username = "mcp_reader"
# Read from the environment when mcp-rs starts. If it is not set, mcp-rs
# starts without the database tools and shows the reason in mcp_rs_status
password = "${MCP_DB_PASSWORD}"
# disable, allow, prefer (default), require, verify-ca, verify-full
ssl_mode = "prefer"

# true also offers execute_command (one INSERT, UPDATE, or DELETE at a time)
allow_write = false
# Rows returned by execute_query at most
max_rows = 1000
# Time limit of one SQL statement
query_timeout_seconds = 30
# Connections in the pool at most
max_connections = 5
