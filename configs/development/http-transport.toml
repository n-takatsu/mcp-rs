# mcp-rs: HTTP for development (API tests, debugging)
#
#   cargo run -- --config configs/development/http-transport.toml
#
# The endpoint is http://127.0.0.1:8081/mcp. Up to v0.23.0, this file had a
# "filesystem handler", [logging], and keys under [transport.http] that
# mcp-rs did not read (#557).

[server]
log_level = "debug"

[transport]
type = "http"

[transport.http]
addr = "127.0.0.1"
port = 8081
enable_cors = true
max_request_size = 2097152              # 2 MB (larger for development)
request_timeout_seconds = 60
enable_websocket_upgrade = true         # also accept MCP on /ws

# WordPress (a development site)
[handlers.wordpress]
enabled = true
url = "https://dev-wordpress-site.com"
username = "dev-user"
password = "dev-password"
timeout_seconds = 30
