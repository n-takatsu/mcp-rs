# mcp-rs: WordPress over STDIO, for tests
#
# Up to v0.23.0, this file did not load ([transport] was missing, and
# requests_per_second was 10.0, #557).

[server]
log_level = "info"

[transport]
type = "stdio"

[handlers.wordpress]
url = "${WORDPRESS_URL}"
username = "${WORDPRESS_USERNAME}"
password = "${WORDPRESS_PASSWORD}"
enabled = true
timeout_seconds = 30

[handlers.wordpress.rate_limit]
enabled = false
requests_per_second = 10                # an integer (10.0 did not load, #557)
burst_size = 20
