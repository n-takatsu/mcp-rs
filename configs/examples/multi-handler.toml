# mcp-rs: WordPress, PostgreSQL, and a plugin together
#
# One mcp-rs serves the tools of all three to the AI client (STDIO).
# Start with an absolute path:
#
#   mcp-rs --config /path/to/multi-handler.toml
#
# Secrets come from environment variables (${...}). mcp-rs does not start if a
# variable used in [handlers.wordpress] is not set; in [database], it starts
# without the database tools instead. See:
#   https://n-takatsu.github.io/mcp-rs/docs/guides/       (getting started)
#   https://n-takatsu.github.io/mcp-rs/docs/database/     ([database])
#   https://n-takatsu.github.io/mcp-rs/docs/plugins/      ([[plugins]])
#
# Up to v0.23.0, this file showed a format that mcp-rs never read
# ([handlers.<any name>] with type = "...", #557).

[server]
log_level = "info"

[transport]
type = "stdio"

# WordPress: one site. Tools such as get_posts and create_post
[handlers.wordpress]
enabled = true                          # required
url = "https://your-wordpress-site.com"
username = "${WORDPRESS_USERNAME}"
password = "${WORDPRESS_PASSWORD}"      # an Application Password
# keyring = "my-site"                   # or: the OS credential store, instead of username/password

# PostgreSQL: read-only by default. Tools execute_query and get_schema
[database]
engine = "postgresql"
host = "localhost"
port = 5432
database = "app"
username = "mcp_reader"
password = "${MCP_DB_PASSWORD}"
ssl_mode = "prefer"                     # use verify-full (and ssl_root_cert) across a network
# allow_write = false                   # true also offers execute_command

# A plugin: another MCP server, started by mcp-rs. Its tools are named
# files__<tool>. Here, a server on Node.js: give node and the server's script
# (npx does not work as command, since mcp-rs does not pass PATH to it)
[[plugins]]
name = "files"
command = "node"                        # node.exe on Windows
args = ["/path/to/server-filesystem/dist/index.js", "/path/to/allowed/folder"]
# env = { API_KEY = "${FILES_API_KEY}" }  # the only variables the plugin receives
