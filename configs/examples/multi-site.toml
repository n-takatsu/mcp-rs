# mcp-rs: two WordPress sites from one mcp-rs (v0.30.0 and later)
#
# The tools stay the same; each tool takes a `site` argument ("blog" or
# "shop"). Without it, default_site is used. Start with an absolute path:
#
#   mcp-rs --config /path/to/multi-site.toml
#
# Store each site's username and Application Password in the OS credential
# store first:
#
#   mcp-rs wordpress-keyring set blog
#   mcp-rs wordpress-keyring set shop
#
# See https://n-takatsu.github.io/mcp-rs/docs/wordpress/#sites

[server]
log_level = "info"

[transport]
type = "stdio"

# Settings for all the sites
[handlers.wordpress]
enabled = true                          # required
default_site = "blog"                   # used when a tool call names no site
timeout_seconds = 30                    # each site can set its own

[handlers.wordpress.sites.blog]
url = "https://blog.example.com"
keyring = "blog"

[handlers.wordpress.sites.shop]
url = "https://shop.example.com"
keyring = "shop"
# enabled = false                       # stop using this site only
