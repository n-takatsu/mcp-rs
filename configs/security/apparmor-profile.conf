# AppArmor Profile for MCP Plugin Containers
# Restricts file system access and capabilities for plugin containers

#include <tunables/global>

profile mcp-plugin-container flags=(attach_disconnected,mediate_deleted) {
  #include <abstractions/base>

  # Network access
  network inet tcp,
  network inet udp,
  network inet icmp,
  network inet6 tcp,
  network inet6 udp,
  network inet6 icmp,

  # Deny raw sockets (except for ping)
  deny network raw,
  deny network packet,

  # File system access
  # Read-only access to application files
  /app/** r,
  
  # Read-write access to data directory
  /data/** rw,
  
  # Read-write access to temporary directory
  /tmp/** rw,
  
  # Read-only access to system libraries
  /lib/** mr,
  /lib64/** mr,
  /usr/lib/** mr,
  
  # Read-only access to /proc and /sys
  @{PROC}/ r,
  @{PROC}/@{pid}/** r,
  @{PROC}/sys/kernel/random/uuid r,
  /sys/devices/** r,
  
  # Deny access to sensitive files
  deny /etc/shadow r,
  deny /etc/passwd w,
  deny /etc/group w,
  deny /root/** rw,
  deny /home/** rw,
  deny /boot/** rw,
  
  # Capability restrictions
  # Allow only necessary capabilities
  capability setgid,
  capability setuid,
  capability net_bind_service,
  
  # Deny dangerous capabilities
  deny capability sys_admin,
  deny capability sys_module,
  deny capability sys_rawio,
  deny capability sys_ptrace,
  deny capability sys_boot,
  deny capability sys_time,
  deny capability mac_admin,
  deny capability mac_override,
  
  # Signal permissions
  signal send set=(kill,term,hup) peer=mcp-plugin-container,
  deny signal send peer=unconfined,
  
  # Mount restrictions
  deny mount,
  deny umount,
  deny pivot_root,
  deny remount,
  
  # Process restrictions
  deny @{PROC}/sys/kernel/core_pattern w,
  deny @{PROC}/sys/vm/** w,
  deny @{PROC}/kcore r,
  deny @{PROC}/kallsyms r,
  deny @{PROC}/modules r,
  
  # Device restrictions
  deny /dev/mem rw,
  deny /dev/kmem rw,
  deny /dev/port rw,
  deny /dev/sd* rw,
  deny /dev/nvme* rw,
  
  # Allow stdout/stderr/stdin
  /dev/tty rw,
  /dev/pts/* rw,
  /dev/null rw,
  /dev/zero r,
  /dev/random r,
  /dev/urandom r,
}
