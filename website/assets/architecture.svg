<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
  <title id="title">mcp-rs architecture</title>
  <desc id="desc">AI clients connect to mcp-rs over STDIO or HTTP. mcp-rs checks each call (authentication, tool limits, rate limits, audit log) and passes it to its handlers: WordPress sites through the REST API, one PostgreSQL, MySQL or MariaDB database, and other MCP servers started as plugins.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --card: #f6f8fa;
          --blue: #0969da; --blue-bg: #ddf4ff; --rust: #b7410e; --rust-bg: #fff1e5; --green: #1a7f37; --green-bg: #dafbe1; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --card: #151b23;
            --blue: #4493f8; --blue-bg: #0c2d6b; --rust: #f0883e; --rust-bg: #3d1d0b; --green: #3fb950; --green-bg: #0f2d1a; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .bg { fill: var(--bg); }
    .h { font-size: 15px; font-weight: 700; }
    .t { font-size: 13px; }
    .s { font-size: 12px; fill: var(--muted); }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: .06em; fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .client { fill: var(--blue-bg); stroke: var(--blue); stroke-width: 1.5; }
    .core { fill: var(--rust-bg); stroke: var(--rust); stroke-width: 2; }
    .target { fill: var(--green-bg); stroke: var(--green); stroke-width: 1.5; }
    .inner { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
    .arrow { stroke: var(--muted); stroke-width: 2; fill: none; marker-end: url(#head); }
    .head { fill: var(--muted); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="440" rx="12"/>

  <!-- AI clients -->
  <text class="lbl" x="24" y="40">AI CLIENTS</text>
  <rect class="client" x="24" y="56" width="220" height="56" rx="10"/>
  <text class="h" x="40" y="80">Claude Desktop</text>
  <text class="s" x="40" y="99">STDIO</text>
  <rect class="client" x="24" y="124" width="220" height="56" rx="10"/>
  <text class="h" x="40" y="148">Claude Code</text>
  <text class="s" x="40" y="167">STDIO</text>
  <rect class="client" x="24" y="192" width="220" height="56" rx="10"/>
  <text class="h" x="40" y="216">GitHub Copilot (VS Code)</text>
  <text class="s" x="40" y="235">STDIO</text>
  <rect class="client" x="24" y="260" width="220" height="56" rx="10"/>
  <text class="h" x="40" y="284">Other MCP clients</text>
  <text class="s" x="40" y="303">HTTP /mcp (WebSocket /ws)</text>
  <text class="s" x="24" y="348">Set up with mcp-rs init</text>
  <text class="s" x="24" y="366">(Scoop, Homebrew, or install script)</text>

  <path class="arrow" d="M248 84 C 290 84, 290 186, 322 186"/>
  <path class="arrow" d="M248 152 C 285 152, 285 196, 322 196"/>
  <path class="arrow" d="M248 220 C 285 220, 285 206, 322 206"/>
  <path class="arrow" d="M248 288 C 290 288, 290 216, 322 216"/>

  <!-- mcp-rs core -->
  <rect class="core" x="326" y="56" width="308" height="320" rx="14"/>
  <rect x="346" y="74" width="34" height="34" rx="8" fill="#b7410e"/>
  <g stroke="#fff" stroke-width="2.7" stroke-linecap="round">
    <line x1="363" y1="92" x2="354" y2="83"/><line x1="363" y1="92" x2="372" y2="83"/><line x1="363" y1="92" x2="363" y2="102"/>
  </g>
  <g fill="#fff"><circle cx="363" cy="92" r="4.8"/><circle cx="354" cy="83" r="3.2"/><circle cx="372" cy="83" r="3.2"/><circle cx="363" cy="102" r="3.2"/></g>
  <text x="392" y="91" style="font-size:20px;font-weight:800">mcp-rs</text>
  <text class="s" x="392" y="106">MCP server in Rust</text>

  <rect class="inner" x="346" y="124" width="268" height="62" rx="8"/>
  <text class="h" x="360" y="146">Transport</text>
  <text class="t" x="360" y="167">STDIO, or HTTP with TLS / mTLS</text>

  <rect class="inner" x="346" y="196" width="268" height="100" rx="8"/>
  <text class="h" x="360" y="218">Checks on every call</text>
  <text class="t" x="360" y="239">API key or OAuth 2.1 (HTTP)</text>
  <text class="t" x="360" y="258">Tool limits per caller</text>
  <text class="t" x="360" y="277">Rate limits and audit log</text>

  <rect class="inner" x="346" y="306" width="268" height="54" rx="8"/>
  <text class="h" x="360" y="327">Credentials</text>
  <text class="t" x="360" y="347">OS credential store, or encrypted</text>

  <path class="arrow" d="M638 196 C 670 196, 668 104, 700 104"/>
  <path class="arrow" d="M638 216 C 668 216, 668 216, 700 216"/>
  <path class="arrow" d="M638 236 C 670 236, 668 328, 700 328"/>

  <!-- Targets -->
  <text class="lbl" x="704" y="40">TOOLS FOR</text>
  <rect class="target" x="704" y="56" width="232" height="96" rx="10"/>
  <text class="h" x="720" y="80">WordPress sites</text>
  <text class="t" x="720" y="101">REST API: posts, pages, media,</text>
  <text class="t" x="720" y="119">comments, taxonomies, settings</text>
  <text class="s" x="720" y="138">One or more sites</text>

  <rect class="target" x="704" y="168" width="232" height="96" rx="10"/>
  <text class="h" x="720" y="192">Database</text>
  <text class="t" x="720" y="213">PostgreSQL, MySQL, MariaDB</text>
  <text class="t" x="720" y="231">SQL tools</text>
  <text class="s" x="720" y="250">Read-only unless allowed</text>

  <rect class="target" x="704" y="280" width="232" height="96" rx="10"/>
  <text class="h" x="720" y="304">Plugins</text>
  <text class="t" x="720" y="325">Tools of other MCP servers</text>
  <text class="t" x="720" y="343">Process, Docker, or Kubernetes</text>
  <text class="s" x="720" y="362">STDIO MCP servers</text>

  <text class="s" x="24" y="420">mcp_rs_status shows the version, config file, logs, and anything that failed to start.</text>
</svg>
