name: CI

# 文章だけの変更ではRustのビルド・テストに影響しないため実行しない
# （RustのコードがMarkdown等をinclude_str!で取り込んでいないことは確認済み。
# 取り込む場合はここから外すこと）。コードと文章の両方を変更した場合は
# 通常どおり実行される。
on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'project-docs/**'
      - 'website/**'
  pull_request:
    branches: [ main, develop ]  # developブランチへのPRも含める
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'project-docs/**'
      - 'website/**'

# 同じコミットに対する重複実行を取り消し
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Limit parallelism to prevent resource exhaustion
  CARGO_BUILD_JOBS: 1
  # Reduce memory usage and disable LTO for CI
  CARGO_BUILD_TARGET_DIR: target
  CARGO_NET_RETRY: 2

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust:
          - stable
          # beta と nightly を一時的に無効化して高速化
          # - beta
          # - nightly
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    # Cargo.lockが変わっても（リリースのバージョン更新や依存関係の更新）
    # 直前のキャッシュから部分的に復元できる。PRではキャッシュを保存せず、
    # develop/mainへのpushで保存したものを使う。PRごとに保存すると
    # Actionsのキャッシュ容量（10GB）を圧迫し、develop/mainのキャッシュが
    # 追い出されてしまうため。
    #
    # キーと完全に一致するキャッシュを復元したときは、保存しない。キーは
    # Cargo.lockとツールチェーンで決まるので、ビルドする内容を変えても
    # （例: 全機能のテストを足した#510）、それらが変わるまでキャッシュに
    # 入らない。ビルドする内容を大きく変えたときは、prefix-keyの番号を
    # 上げて、新しいキャッシュを保存させる
    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: v1-rust
        save-if: ${{ github.event_name == 'push' }}

    # fmtとclippyはOSにほぼ依存しないためUbuntuでのみ実行する。Windowsでの
    # 型チェックは後段の「Check all features」で行う。
    - name: Check formatting
      if: runner.os == 'Linux' && matrix.rust == 'stable'
      run: cargo fmt --all -- --check

    - name: Run clippy
      if: runner.os == 'Linux' && matrix.rust == 'stable'
      # Limit clippy to the library target to avoid compiling examples on the runner.
      # double_must_use is allowed because async_trait's macro expansion attaches an
      # unannotated #[must_use] to methods that already return a #[must_use] Result,
      # which newer clippy versions flag as a false positive.
      run: cargo clippy --lib --all-features -- -D warnings -A clippy::double_must_use

    # 全機能のclippyでは、ある機能でだけ使うコードが既定のビルドで
    # 使われない（dead_code）ことに気づけないため、既定の機能でも確かめる。
    - name: Run clippy (default features)
      if: runner.os == 'Linux' && matrix.rust == 'stable'
      run: cargo clippy --lib -- -D warnings -A clippy::double_must_use

    # PR用の詳細なClippyレポート
    - name: Generate clippy report for PR
      if: runner.os == 'Linux' && matrix.rust == 'stable' && github.event_name == 'pull_request'
      shell: bash
      run: |
        # Run clippy only for the library to avoid building examples in PR analysis
        cargo clippy --lib --all-features --message-format=json -- -D warnings -A clippy::double_must_use > clippy-report.json || true
        echo "### 📋 Clippy Analysis Results" >> $GITHUB_STEP_SUMMARY
        if [ -s clippy-report.json ]; then
          echo "✅ All Clippy checks passed!" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Clippy issues found. Please review the logs above." >> $GITHUB_STEP_SUMMARY
        fi

    # Ubuntuではclippy（--all-features）が同じ型チェックを兼ねるため、
    # Windowsでのみ実行する。Windows固有のコード（cfg(windows)）も含め、
    # 全機能の組み合わせがWindowsでコンパイルできることを確認する。
    - name: Check all features
      if: runner.os == 'Windows'
      run: cargo check --lib --all-features --jobs 1

    - name: Run unit tests
      env:
        CARGO_PROFILE_TEST_LTO: false
      run: cargo test --lib --verbose --jobs 1

    # 既定の機能で、全テストターゲットとexampleがコンパイルできることの確認。
    # 下の全機能のステップだけでは、required-featuresの付け忘れ等、既定の
    # 機能でだけ壊れるもの（#495）に気づけない
    - name: Check that all tests and examples compile
      if: runner.os == 'Linux' && matrix.rust == 'stable'
      env:
        CARGO_PROFILE_TEST_LTO: false
      run: cargo test --no-run --jobs 1

    # tests/の結合テストとdoctestを実行し、exampleはコンパイルだけする
    # （#510）。mysql_security_tests等は機能が要るので、全機能で実行する
    # （依存クレートは既定の機能とは別にコンパイルされる）。サーバーが要る
    # テストは#[ignore]にしてある。時間がかかるため、Ubuntuだけで実行する。
    # 全機能の依存クレートのコンパイルに時間がかかるので、このステップだけ
    # 並列度を上げる（ubuntu-latestは4コア・16GB。CARGO_BUILD_JOBS: 1は、
    # 以前のランナーでのディスク・メモリー不足への対策）
    - name: Run all tests (all features)
      if: runner.os == 'Linux' && matrix.rust == 'stable'
      env:
        CARGO_PROFILE_TEST_LTO: false
      run: cargo test --all-features --no-fail-fast --jobs 4

    - name: Show disk usage
      if: always() && runner.os == 'Linux' && matrix.rust == 'stable'
      run: |
        df -h /
        du -sh target

    # PowerShellテスト（Windows環境のみ）- 簡素化版
    - name: Run PowerShell integration tests
      if: runner.os == 'Windows' && matrix.rust == 'stable'
      shell: powershell
      run: |
        Write-Host "Setting up PowerShell test environment..."

        # テスト設定ファイルの確認（以前はこの前にリリースビルドを行って
        # いたが、ビルド成果物は使っておらず、全体の再コンパイルになるだけ
        # だったため削除した）
        $configFound = $false
        $configPath = ""

        if (Test-Path "configs/production/main.toml") {
            $configPath = "configs/production/main.toml"
            $configFound = $true
        }
        if (Test-Path "configs/development/http-transport.toml") {
            $configPath = "configs/development/http-transport.toml"
            $configFound = $true
        }

        if (-not $configFound) {
            Write-Host "No config file found for testing"
            exit 1
        }

        Write-Host "Using config: $configPath"
        Write-Host "PowerShell environment setup completed successfully"

    # 設定ファイル検証（全OS）
    - name: Validate project configuration
      if: matrix.rust == 'stable'
      shell: bash
      run: |
        echo "Validating configuration files..."

        # configs/ディレクトリ構造の検証
        config_count=0
        for config in configs/production/*.toml configs/development/*.toml; do
          if [ -f "$config" ]; then
            echo "Found config: $config"
            config_count=$((config_count + 1))

            # TOML構文の基本チェック（簡易版 - フルvalidationは時間がかかるためスキップ）
            if grep -q "^\[" "$config"; then
              echo "Config $config appears to be valid TOML format"
            else
              echo "Warning: Config $config may have format issues"
            fi
          fi
        done

        echo "Configuration validation completed. Found $config_count config files."

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-audit
      run: cargo install cargo-audit
    - name: Run cargo audit
      run: cargo audit --ignore RUSTSEC-2023-0071
      # RUSTSEC-2023-0071: RSA脆弱性を無視
      # 理由: sqlx-mysql経由の未使用依存関係のため影響なし
      # mysql_asyncを使用してMySQL機能を安全に実装済み
