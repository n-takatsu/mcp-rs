name: Rust

# ci.yml と重複するため、必要時の手動実行のみ許可
on:
  workflow_dispatch:

# 同じコミットに対する重複実行を取り消し  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
