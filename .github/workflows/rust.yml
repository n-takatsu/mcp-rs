name: Rust

# ci.yml と重複するため、必要時の手動実行のみ許可
on:
  workflow_dispatch:

# 同じコミットに対する重複実行を取り消し  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# ジョブが既定で持つ権限。リポジトリの既定の設定に依存しないよう、
# 読み取りだけを明示する。書き込みが要るジョブは、ジョブの
# permissions:で足す（#542）
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
