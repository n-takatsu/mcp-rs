# ========================================
# GitHub Actions Workflow: Docker Security Scan
# ========================================

name: Docker Security Scan

on:
  push:
    branches: [ main, develop, 'feature/issue-44-*' ]
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.github/workflows/docker-security.yml'
      # 起動のしかた（引数・設定ファイル）を変えたときも、イメージの起動を確かめる
      - 'src/main.rs'
      - 'src/cli_args.rs'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.github/workflows/docker-security.yml'
      - 'src/main.rs'
      - 'src/cli_args.rs'
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

env:
  IMAGE_NAME: mcp-rs
  REGISTRY: ghcr.io

jobs:
  build-and-scan:
    name: Build and Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          # キャッシュはdevelop（既定のブランチ）でだけ保存する。PR・main等に
          # 保存したものは、そのrefの実行からしか読めず、キャッシュの容量を
          # 圧迫するため（#515）。空にすると保存しない
          cache-to: ${{ github.ref == 'refs/heads/develop' && 'type=gha,mode=max' || '' }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Report vulnerabilities but don't fail build

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy (Table format)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Check image size
        run: |
          IMAGE_SIZE=$(docker image inspect ${{ env.IMAGE_NAME }}:${{ github.sha }} --format='{{.Size}}')
          IMAGE_SIZE_MB=$((IMAGE_SIZE / 1024 / 1024))
          echo "Image size: ${IMAGE_SIZE_MB}MB"
          
          # Fail if image > 50MB (target: <50MB)
          if [ $IMAGE_SIZE_MB -gt 50 ]; then
            echo "❌ Image size ${IMAGE_SIZE_MB}MB exceeds 50MB target"
            exit 1
          else
            echo "✅ Image size ${IMAGE_SIZE_MB}MB meets <50MB target"
          fi

      # イメージが既定の引数で起動し、MCPのリクエストに答えることを確かめる
      # （#497: 以前は存在しない--transportを既定の引数にしていて起動しなかった）
      - name: Test container startup
        shell: bash
        run: |
          set -euo pipefail
          IMG=${{ env.IMAGE_NAME }}:${{ github.sha }}

          echo "::group::--version"
          docker run --rm "$IMG" --version | tee version.txt
          grep -q '^mcp-rs [0-9]' version.txt
          echo "::endgroup::"

          echo "::group::No config file mounted"
          if docker run --rm "$IMG" 2> noconfig.txt; then
            echo "❌ mcp-rs started without a config file"; exit 1
          fi
          cat noconfig.txt
          grep -q '/app/config/mcp-config.toml' noconfig.txt
          echo "::endgroup::"

          mkdir -p smoke-config
          printf '%s\n' '[server]' 'log_level = "info"' '[transport]' 'type = "stdio"' '[handlers]' \
            > smoke-config/mcp-config.toml
          chmod -R a+rX smoke-config
          REQUESTS='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"mcp_rs_status","arguments":{}}}'

          # docs/DOCKER_GUIDE.mdのSTDIOの例と同じ引数（-iのみ）と、
          # docker-compose.ymlと同じ読み取り専用＋/home/nonrootの名前付き
          # ボリュームの2通りで確かめる
          run_stdio() {
            echo "$REQUESTS" | sed 's/^ *//' \
              | timeout 60 docker run -i --rm "$@" \
                  -v "$PWD/smoke-config:/app/config:ro" "$IMG" > out.txt 2> err.txt || true
            echo "--- stdout"; cat out.txt
            echo "--- stderr (last 20 lines)"; tail -n 20 err.txt
            grep -q '"serverInfo"' out.txt
            grep -q 'Config file: /app/config/mcp-config.toml' out.txt
          }

          echo "::group::STDIO"
          run_stdio
          echo "::endgroup::"

          # 監査ログが名前付きボリュームに書かれ、コンテナを作り直しても
          # 残ることを確かめる（2回起動し、2回分の記録があること）
          echo "::group::STDIO, read-only root filesystem, named volume at /home/nonroot"
          docker volume rm -f mcp-ci-state > /dev/null
          for run in 1 2; do
            run_stdio --read-only -v mcp-ci-state:/home/nonroot --tmpfs /tmp
            grep -q 'Audit log: /home/nonroot/.local/state/mcp-rs/audit/audit.log' out.txt
            grep -q 'Log: /home/nonroot/.local/state/mcp-rs/logs/' out.txt
          done
          CALLS=$(docker run --rm -v mcp-ci-state:/state:ro busybox:1.36 \
            grep -c mcp_rs_status /state/.local/state/mcp-rs/audit/audit.log)
          echo "Audit log entries for mcp_rs_status in the volume: $CALLS"
          if [ "$CALLS" -lt 2 ]; then
            echo "❌ The audit log was not kept in the named volume"; exit 1
          fi
          docker volume rm -f mcp-ci-state > /dev/null
          echo "::endgroup::"

          echo "✅ The image starts and answers initialize and mcp_rs_status"

      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0
        if: success()
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 30

  docker-compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          echo "✅ docker-compose.yml is valid"

      - name: Validate docker-compose.dev.yml
        run: |
          docker compose -f docker-compose.dev.yml config > /dev/null
          echo "✅ docker-compose.dev.yml is valid"

      - name: Test Docker Compose (skip startup test)
        run: |
          echo "✅ Docker Compose validation passed"
          echo "Note: the image's startup is tested in 'Build and Security Scan'"
