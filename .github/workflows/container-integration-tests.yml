name: Container Integration Tests

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/container-integration-tests.yml'
      - 'docker-compose.test.yml'
      - 'tests/integration/**'
      - 'tests/common/**'
      - 'tests/database/**'
      - 'tests/fixtures/**'
      - 'tests/*postgres*'
      - 'tests/database_handler_*'
      - 'tests/column_encryption_rbac_test.rs'
      - 'migrations/**'
      - 'src/handlers/database/**'
      - 'src/transport/**'
      - 'src/plugin_proxy/**'
      - 'src/security/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/container-integration-tests.yml'
      - 'docker-compose.test.yml'
      - 'tests/integration/**'
      - 'tests/common/**'
      - 'tests/database/**'
      - 'tests/fixtures/**'
      - 'tests/*postgres*'
      - 'tests/database_handler_*'
      - 'tests/column_encryption_rbac_test.rs'
      - 'migrations/**'
      - 'src/handlers/database/**'
      - 'src/transport/**'
      - 'src/plugin_proxy/**'
      - 'src/security/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mcptest
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # setup-rust-toolchainは、中でrust-cacheを使う。キャッシュはdevelop
      # （既定のブランチ）でだけ保存する。PR・mainに保存したものは、その
      # refの実行からしか読めず、キャッシュの容量を圧迫するため（#515）
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache-save-if: ${{ github.ref == 'refs/heads/develop' }}
          components: clippy, rustfmt

      # サービスのコンテナの中のpg_isready・redis-cliで確かめる。apt-getで
      # クライアントを入れると、Ubuntuのパッケージサーバーに届かないときに
      # テストの前で失敗するため（#495）
      - name: Verify services are ready
        run: |
          docker exec ${{ job.services.postgres.id }} pg_isready -U testuser -d mcptest
          docker exec ${{ job.services.redis.id }} redis-cli ping

      - name: Build project
        run: cargo build --features integration-tests --release

      - name: Run unit tests
        run: cargo test --lib --features integration-tests

      # プラグインのコンテナ隔離（#411）を、実際のDockerで確かめる
      - name: Run plugin container isolation test (Docker)
        env:
          MCP_RS_DOCKER_TESTS: "1"
        run: cargo test --lib --features integration-tests plugin_proxy::tests::test_container_plugin_is_isolated_in_docker -- --nocapture

      # データベースのツール（#453）を、上のpostgresのサービスで確かめる
      - name: Run database tool tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgres://testuser:testpass@localhost:5433/mcptest
        run: cargo test --features database --test database_postgres_tools_test -- --nocapture

      # サーバーが要る結合テスト（#[ignore]）を、上のpostgres・redisのサービスで
      # 実行する（#513）。同じデータベース・キーを使うテストがあるので、1つずつ
      # 実行する。対象と、ローカルで実行する方法は
      # docs/development/integration-tests.md
      - name: Run database integration tests (PostgreSQL, Redis)
        env:
          TEST_DATABASE_URL: postgres://testuser:testpass@localhost:5433/mcptest
          TEST_REDIS_URL: redis://localhost:6380/0
        run: >-
          cargo test --features redis-backend --no-fail-fast
          --test mod
          --test postgres_engine_test --test postgres_jsonb_migration_test
          --test postgres_transaction_test --test postgres_integration_test
          --test database_handler_column_encryption_test
          --test database_handler_micro_segmentation_test
          --test column_encryption_rbac_test
          -- --ignored --test-threads=1

      - name: Verify integration test compilation
        run: |
          echo "Verifying integration tests compile successfully..."
          cargo test --features integration-tests --no-run
          echo "✓ Integration tests compiled successfully"
          
      - name: Run unit tests with integration features
        run: |
          echo "Running unit tests with integration-tests feature..."
          cargo test --lib --features integration-tests
          echo "✓ Unit tests passed"
          
      - name: Note about integration tests
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Note: Full integration tests require running MCP servers"
          echo "These are best run locally using:"
          echo "  ./scripts/run-integration-tests.sh"
          echo "  or"
          echo "  ./scripts/run-integration-tests.ps1"
          echo ""
          echo "This CI job verifies:"
          echo "  ✓ Integration test code compiles"
          echo "  ✓ Unit tests pass"
          echo "  ✓ Dependencies are correct"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            target/debug/deps/*.log
            target/release/deps/*.log

  # プラグインをKubernetesのJobとして起動したときの隔離（#413）を、
  # kindのクラスタで確かめる
  plugin-kubernetes-test:
    name: Plugin Kubernetes Isolation Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache-save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: mcp-rs-plugins

      - name: Load test image into the cluster
        run: |
          docker pull python:3.12-alpine
          kind load docker-image python:3.12-alpine --name mcp-rs-plugins

      - name: Run plugin Kubernetes isolation test
        env:
          MCP_RS_K8S_TESTS: "1"
        run: cargo test --lib plugin_proxy::tests::test_kubernetes_plugin_is_isolated -- --nocapture

  # HTTPモードのOAuth 2.1（#420）を、Keycloakが発行したトークンで確かめる
  oauth-keycloak-test:
    name: OAuth Keycloak Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache-save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Start Keycloak
        run: |
          docker run -d --name keycloak -p 8080:8080             -e KC_BOOTSTRAP_ADMIN_USERNAME=admin             -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin             quay.io/keycloak/keycloak:26.4 start-dev
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/realms/master/.well-known/openid-configuration > /dev/null; then
              echo "Keycloak is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs keycloak
          exit 1

      - name: Run OAuth Keycloak test
        env:
          MCP_RS_KEYCLOAK_TESTS: "1"
          MCP_RS_KEYCLOAK_URL: http://localhost:8080
        run: cargo test --lib transport::http::tests::test_keycloak_access_tokens -- --nocapture

      - name: Show Keycloak logs
        if: failure()
        run: docker logs keycloak

  docker-compose-tests:
    name: Docker Compose Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Start test environment
        run: |
          docker compose -f docker-compose.test.yml up -d postgres-test redis-test
          sleep 10

      - name: Build and start MCP servers
        run: |
          echo "Building MCP servers..."
          docker compose -f docker-compose.test.yml build mcp-server-http mcp-server-websocket
          echo "Starting MCP servers..."
          docker compose -f docker-compose.test.yml up -d mcp-server-http mcp-server-websocket
          
      - name: Wait for containers
        run: |
          echo "Waiting for containers to initialize..."
          sleep 10
          
      - name: Check container status
        run: |
          echo "=== Container Status ==="
          docker compose -f docker-compose.test.yml ps -a
          echo ""
          echo "=== Running Containers ==="
          docker ps -a
          
      - name: Show MCP server logs
        run: |
          echo "=== MCP HTTP Server Logs ==="
          docker compose -f docker-compose.test.yml logs mcp-server-http || echo "No logs available"
          echo ""
          echo "=== MCP WebSocket Server Logs ==="
          docker compose -f docker-compose.test.yml logs mcp-server-websocket || echo "No logs available"
          echo ""
          echo "=== Checking if containers are running ==="
          if ! docker ps | grep -q mcp-server-http-test; then
            echo "ERROR: mcp-server-http-test is not running!"
            docker inspect mcp-server-http-test || true
          fi
          if ! docker ps | grep -q mcp-server-websocket-test; then
            echo "ERROR: mcp-server-websocket-test is not running!"
            docker inspect mcp-server-websocket-test || true
          fi
          
      - name: Check container health
        continue-on-error: true
        run: |
          echo "Waiting for servers to be ready..."
          sleep 10
          curl --retry 5 --retry-delay 2 --retry-connrefused http://localhost:3001/health || echo "HTTP server not responding"
          curl --retry 5 --retry-delay 2 --retry-connrefused http://localhost:3002/health || echo "WebSocket server not responding"

      - name: Run Docker Compose tests
        continue-on-error: true
        run: |
          echo "=== Attempting to run tests ==="
          docker compose -f docker-compose.test.yml logs mcp-server-http || echo "No HTTP logs"
          docker compose -f docker-compose.test.yml logs mcp-server-websocket || echo "No WebSocket logs"
          echo "Note: Docker Compose tests are currently experimental"
          echo "Integration tests run in the 'integration-tests' job using GitHub Actions services"

      - name: Show container logs
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml logs

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v

      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-logs
          path: |
            docker-compose.test.yml

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: 'trivy-results.sarif'

  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mcptest
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5433:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache-save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Run performance tests
        env:
          MCP_HTTP_ENDPOINT: http://localhost:3001
          DATABASE_URL: postgres://testuser:testpass@localhost:5433/mcptest
          REDIS_URL: redis://localhost:6380
          RUN_PERFORMANCE_TESTS: "true"
        run: |
          cargo test --features integration-tests performance -- --test-threads=1 --nocapture

      - name: Upload performance results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-results
          path: target/criterion/
