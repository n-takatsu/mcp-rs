name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'website/**'
      - 'project-docs/**'
      - 'README.md'

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

# ジョブが既定で持つ権限。リポジトリの既定の設定に依存しないよう、
# 読み取りだけを明示する。書き込みが要るジョブは、ジョブの
# permissions:で足す（#542）
permissions:
  contents: read

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # actions/configure-pages が、Pagesの設定を読む
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: ./website
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        
      - name: Install Jekyll dependencies
        run: |
          cd website
          bundle install
          
      - name: Build Rust documentation
        run: cargo doc --no-deps --document-private-items
          
      - name: Build Jekyll website
        run: |
          cd website
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          
      - name: Copy Rust docs to Jekyll site
        run: |
          mkdir -p ./website/_site/rustdoc
          cp -r ./target/doc/* ./website/_site/rustdoc/
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./website/_site

  # Deployment job (only on main branch)
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1