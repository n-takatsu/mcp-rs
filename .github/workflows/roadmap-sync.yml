name: 🎯 ROADMAP-Project Synchronization

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, milestoned, demilestoned]
  schedule:
    # 毎日 9:00 JST に ROADMAP 同期チェック実行
    - cron: '0 0 * * *'  # UTC 00:00 = JST 09:00
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force complete ROADMAP synchronization'
        type: boolean
        default: false

jobs:
  roadmap-sync:
    runs-on: ubuntu-latest
    name: 📊 ROADMAP Synchronization
    permissions:
      contents: write
      issues: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: ROADMAP Sync Analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        echo "🎯 ROADMAP synchronization processing..."
        echo "Issue Number: ${{ github.event.issue.number || 'scheduled' }}"
        echo "Milestone: ${{ github.event.issue.milestone.title || 'none' }}"

        # Check if ROADMAP.md needs updating
        if [ -f "ROADMAP.md" ]; then
          echo "ROADMAP.md exists, checking for updates needed..."
        else
          echo "ROADMAP.md not found, creating basic structure..."
          exit 0
        fi

        # Determine whether this run should update roadmap contents.
        should_sync=false
        event_name="${{ github.event_name }}"

        if [[ "$event_name" == "schedule" ]]; then
          should_sync=true
        elif [[ "$event_name" == "workflow_dispatch" && "${{ github.event.inputs.force_sync || 'false' }}" == "true" ]]; then
          should_sync=true
        elif [[ "$event_name" == "issues" ]]; then
          issue_milestone="${{ github.event.issue.milestone.title || '' }}"
          if [[ "$issue_milestone" == "v0.2.0-beta" || "$issue_milestone" == "v0.3.0" || "$issue_milestone" == "v1.0.0" ]]; then
            should_sync=true
          fi
        fi

        if [[ "$should_sync" != "true" ]]; then
          echo "No roadmap-relevant event detected. Skipping synchronization."
          exit 0
        fi

        # Milestone progress calculation (search-based to avoid milestone-not-found failures).
        beta_total=$(gh issue list --state all --search 'milestone:"v0.2.0-beta"' --json number | jq length)
        beta_closed=$(gh issue list --state closed --search 'milestone:"v0.2.0-beta"' --json number | jq length)
        v3_total=$(gh issue list --state all --search 'milestone:"v0.3.0"' --json number | jq length)
        v3_closed=$(gh issue list --state closed --search 'milestone:"v0.3.0"' --json number | jq length)
        v1_total=$(gh issue list --state all --search 'milestone:"v1.0.0"' --json number | jq length)
        v1_closed=$(gh issue list --state closed --search 'milestone:"v1.0.0"' --json number | jq length)

        if [[ "$v3_total" -gt 0 ]]; then
          v3_progress=$((v3_closed * 100 / v3_total))
        else
          v3_progress=10
        fi

        if [[ "$v1_total" -gt 0 ]]; then
          v1_progress=$((v1_closed * 100 / v1_total))
        else
          v1_progress=0
        fi

        if [[ "$beta_total" -gt 0 ]]; then
          beta_progress=$((beta_closed * 100 / beta_total))
        else
          beta_progress=100
        fi

        echo "Calculated Progress:"
        echo "- v0.2.0-beta: ${beta_progress}% ($beta_closed/$beta_total)"
        echo "- v0.3.0: ${v3_progress}% ($v3_closed/$v3_total)"
        echo "- v1.0.0: ${v1_progress}% ($v1_closed/$v1_total)"

        # Update active development progress (v0.3.0).
        sed -E -i "s#\| \*\*WebSocket Transport\*\* \| [0-9]+% \| v0\.3\.0 \|#| **WebSocket Transport** | ${v3_progress}% | v0.3.0 |#g" ROADMAP.md

        # Update timestamp only when roadmap content changed.
        if [[ -n "$(git status --porcelain ROADMAP.md)" ]]; then
          current_date=$(date '+%Y年%m月%d日')
          sed -i "s#> \*\*最終更新\*\*:.*#> **最終更新**: $current_date#g" ROADMAP.md
        fi

        if [[ -n "$(git status --porcelain ROADMAP.md)" ]]; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action - ROADMAP Sync"
          git add ROADMAP.md
          git commit -m "🎯 ROADMAP synchronization update - $(date '+%Y-%m-%d')

          Auto-updated progress indicators:
          - v0.2.0-beta: ${beta_progress}%
          - v0.3.0: ${v3_progress}%
          - v1.0.0: ${v1_progress}%

          Generated by: roadmap-sync.yml"
          git push
        else
          echo "No ROADMAP changes detected."
        fi
