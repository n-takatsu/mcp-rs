name: "Issue Auto-Labeler"

# Issueを立てたときに、タイトルからコンポーネントのラベルだけを付ける（#517）。
#
# - 種類（enhancement・bug等）と優先度（priority: *）は、棚卸しで手で付ける
#   ので、ここでは付けない。以前は`low`・`high`等の部分一致で付けていて、
#   `allow`・`workflow`を含むタイトルに`priority: low`が付いていた
# - 本文は調べない。コードやファイル名（`Blocked(...)`・`websocket_*.rs`等）に
#   反応して、誤ったラベルが付くため
# - 単語の境界で調べる（`dockerfile`に`kubernetes`を付けない等）
# - `opened`でだけ動く。`edited`でも動くと、手で外したラベルが、Issueを
#   編集したときにまた付く
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Add component labels from the title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title;
            // 単語の後ろは、\bではなく「英字が続かない」で調べる。\bだと、
            // Postgres16・MySQL8.0・database_handlerのように数字や_が続く
            // タイトルに付かない
            const rules = [
              { pattern: /\b(security|rustsec)(?![a-z])|セキュリティ|脆弱性/i, labels: ['security'] },
              { pattern: /\b(database|postgres(ql)?|mysql|mariadb|redis|sqlite|mongodb)(?![a-z])|データベース/i, labels: ['database'] },
              { pattern: /\bwebsocket(?![a-z])/i, labels: ['websocket'] },
              { pattern: /\bdocker(file)?(?![a-z])/i, labels: ['docker', 'infrastructure'] },
              { pattern: /\b(kubernetes|k8s|helm)(?![a-z])/i, labels: ['kubernetes', 'infrastructure'] },
            ];

            const labels = [...new Set(
              rules.filter(r => r.pattern.test(title)).flatMap(r => r.labels)
            )];

            if (labels.length === 0) {
              console.log('No automatic labels determined');
              return;
            }
            console.log(`Adding labels: ${labels.join(', ')}`);
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels,
            });
