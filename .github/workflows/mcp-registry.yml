name: MCP Registry

# 公式のMCP Registry（https://registry.modelcontextprotocol.io）に、リリースの
# Claude Desktopの拡張機能（`.mcpb`）を登録する（#668）。MCPのクライアントや
# 一覧サイトは、ここからサーバーを探す。
#
# - リリースのタグ: release-binaries.ymlが、`.mcpb`をリリースに付けた後に
#   呼ぶ（workflow_call）。`server.json`の`version`・`identifier`・
#   `fileSha256`を、そのタグのリリースの`.mcpb`から書き換えて登録する
# - 手動の実行（workflow_dispatch）: 登録済みでないタグを登録し直すため
#   （例: 失敗した登録のやり直し、このワークフローより前のv0.30.0）。同じ
#   版をもう一度登録すると、MCP Registryがエラーを返す
# - このファイルか`server.json`を変えたPR: 登録はせず、`server.json`を
#   MCP Registryで確かめる（`mcp-publisher validate`）だけ
#
# 認証は、GitHub ActionsのOIDC（`mcp-publisher login github-oidc`）で行う。
# 鍵やトークンを持たずに、`io.github.n-takatsu/`の名前で登録できる
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to publish (vX.Y.Z)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (vX.Y.Z)'
        required: true
        type: string
  pull_request:
    paths:
      - 'server.json'
      - '.github/workflows/mcp-registry.yml'

permissions:
  contents: read

env:
  # 版を上げるときは、そのリリースの`mcp-publisher_linux_amd64.tar.gz`の
  # SHA256（リリースのページの`sha256:`）も書き換える。`releases/latest`は
  # 中身が変わるので使わない
  MCP_PUBLISHER_VERSION: v1.8.16
  MCP_PUBLISHER_SHA256: 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05

jobs:
  # PR: 登録はせず、`server.json`を確かめるだけ。OIDCのトークンは取らせない
  # （PR #822のレビュー。確かめるだけのジョブに、登録の権限を持たせない）
  validate:
    name: Validate server.json
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 5 \
            -o "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "${archive}" mcp-publisher
          rm "${archive}"

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

  publish:
    name: Publish to the MCP Registry
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # `mcp-publisher login github-oidc`で、GitHubのOIDCのトークンを取るため
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 5 \
            -o "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "${archive}" mcp-publisher
          rm "${archive}"

      # 登録するタグのリリースの`.mcpb`を落とし、そのSHA256を計って、同じ
      # リリースの`.sha256`と合うことを確かめてから、`server.json`に書く
      - name: Fill server.json from the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag '${TAG}' is not vX.Y.Z"
            exit 1
          fi
          bundle="mcp-rs-${TAG}.mcpb"
          mkdir -p "${RUNNER_TEMP}/release"
          gh release download "${TAG}" -p "${bundle}" -p "${bundle}.sha256" -D "${RUNNER_TEMP}/release"
          sha256=$(sha256sum "${RUNNER_TEMP}/release/${bundle}" | cut -d ' ' -f 1)
          expected=$(cut -d ' ' -f 1 "${RUNNER_TEMP}/release/${bundle}.sha256")
          if [ "${sha256}" != "${expected}" ]; then
            echo "::error::The SHA256 of ${bundle} (${sha256}) does not match ${bundle}.sha256 (${expected})"
            exit 1
          fi
          jq --arg version "${TAG#v}" \
            --arg identifier "https://github.com/${GH_REPO}/releases/download/${TAG}/${bundle}" \
            --arg sha256 "${sha256}" \
            '.version = $version
             | .packages[0].identifier = $identifier
             | .packages[0].fileSha256 = $sha256' \
            server.json > "${RUNNER_TEMP}/server.json"
          mv "${RUNNER_TEMP}/server.json" server.json
          cat server.json

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish

      - name: Log out
        if: always()
        run: ./mcp-publisher logout || true
