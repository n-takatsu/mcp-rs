name: Docker Security Scan

# 文章だけの変更ではDockerイメージの中身が変わらないため実行しない。
# イメージに取り込むのはCargo.toml・Cargo.lock・src・benches・examples・
# testsのみで、文書類は.dockerignoreでも除外している。日次のスケジュール
# 実行はこの設定の影響を受けない。
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'project-docs/**'
      - 'website/**'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'project-docs/**'
      - 'website/**'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

# ジョブが既定で持つ権限。リポジトリの既定の設定に依存しないよう、
# 読み取りだけを明示する。書き込みが要るジョブは、ジョブの
# permissions:で足す（#542）
permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy Container Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Docker image
        run: |
          docker build -t mcp-rs:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'mcp-rs:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy for JSON report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'mcp-rs:${{ github.sha }}'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Check vulnerability threshold
        run: |
          CRITICAL=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-report.json)
          HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-report.json)
          
          echo "CRITICAL vulnerabilities: $CRITICAL"
          echo "HIGH vulnerabilities: $HIGH"
          
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ CRITICAL vulnerabilities found!"
            exit 1
          fi
          
          if [ "$HIGH" -gt 5 ]; then
            echo "⚠️  Too many HIGH vulnerabilities found!"
            exit 1
          fi
          
          echo "✅ Image passed security scan"

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: trivy-scan-results
          path: |
            trivy-results.sarif
            trivy-report.json

  notify:
    name: Notify Security Issues
    needs: [trivy-scan]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Send notification
        # ブランチ名等は、run:の中に${{ }}で書かず、環境変数で渡す（#542）。
        # JSONもjqで作り、名前に"等があっても壊れないようにする
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            jq -n --arg text "🚨 Security scan failed for $REPOSITORY on branch $REF_NAME" '{text: $text}' |
              curl -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK"
          fi
