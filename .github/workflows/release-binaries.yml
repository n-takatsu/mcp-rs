---
name: Release Binaries

# リリースのタグ（vX.Y.Z）で、OSごとのmcp-rsの実行ファイルを作り、GitHubの
# リリースに付ける（#564）。Claude Desktop・Claude Code・VS Codeは、STDIOで
# 手元のmcp-rsを起動するので、Rustの開発環境が無い人にも使えるようにする。
# Dockerのイメージ（deploy.yml）は、OSの資格情報ストア（os-keyring）を
# 含めないので、この使い方には向かない。
#
# deploy.ymlとは別のワークフローにする。deploy.ymlは1時間半ほどかかり、
# 同時に1つだけ動くので、その順番を待たずに作る。
#
# 署名はしない（#564で決めた）。止められたときの開き方と、SHA256での
# 確かめ方はREADMEに書く。
#
# 手動の実行（workflow_dispatch）と、このファイルを変えたPRでは、作るだけで、
# リリースには付けない（ワークフローの成果物として残る）。リリースの前に、
# 3つのOSで作れることを確かめるため
on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - '.github/workflows/release-binaries.yml'
  workflow_dispatch:

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# 作るジョブは読み取りだけにする。依存クレートのビルドスクリプトも動く
# ので、リリースに書く権限は、作ったものを付けるジョブだけに持たせる
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # glibcは、作ったOSの版以降でしか動かない。古い版でも動くよう、
          # 新しいubuntu-latestではなく22.04（glibc 2.35）で作る
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # 既定の機能（database・os-keyring）で作る。Cargo.lockのとおりに作る
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin mcp-rs

      - name: Package
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          # タグのときはタグ（v0.25.0）、ほかはコミット
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          set -euo pipefail
          name="mcp-rs-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          if [ "${TARGET}" = "x86_64-pc-windows-msvc" ]; then
            cp "target/${TARGET}/release/mcp-rs.exe" "dist/${name}/"
          else
            cp "target/${TARGET}/release/mcp-rs" "dist/${name}/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${name}/"
          cd dist
          if [ "${ARCHIVE}" = "zip" ]; then
            7z a -tzip "${name}.zip" "${name}" > /dev/null
            file="${name}.zip"
          else
            tar -czf "${name}.tar.gz" "${name}"
            file="${name}.tar.gz"
          fi
          # sha256sum -c・shasum -a 256 -cで確かめられる形（ハッシュ、空白2つ、名前）
          if command -v sha256sum > /dev/null; then
            sha256sum "${file}" > "${file}.sha256"
          else
            shasum -a 256 "${file}" > "${file}.sha256"
          fi
          cat "${file}.sha256"
          echo "file=${file}" >> "${GITHUB_OUTPUT}"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-rs-${{ matrix.target }}
          path: |
            dist/${{ steps.package.outputs.file }}
            dist/${{ steps.package.outputs.file }}.sha256
          if-no-files-found: error

  # 作ったものを、タグのGitHubのリリースに付ける。リリースは、タグを付けた
  # 後に手で作る（deploy.ymlのSBOMと同じ）。まだ無ければ、30分まで待つ
  publish:
    name: Attach to release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mcp-rs-*
          path: dist
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          # 全部のハッシュを1つにまとめたもの（sha256sum -c SHA256SUMSで確かめる）
          cat ./*.sha256 > SHA256SUMS
          cat SHA256SUMS
          for i in $(seq 1 60); do
            if gh release view "${TAG}" > /dev/null 2>&1; then
              break
            fi
            if [ "${i}" = 60 ]; then
              echo "::error::No GitHub release for ${TAG} after 30 minutes. Create it, then re-run this job"
              exit 1
            fi
            echo "Waiting for the GitHub release ${TAG} (${i}/60)"
            sleep 30
          done
          gh release upload "${TAG}" ./*.zip ./*.tar.gz ./*.sha256 SHA256SUMS --clobber
