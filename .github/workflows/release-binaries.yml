---
name: Release Binaries

# リリースのタグ（vX.Y.Z）で、OSごとのmcp-rsの実行ファイルを作り、GitHubの
# リリースに付ける（#564）。Claude Desktop・Claude Code・VS Codeは、STDIOで
# 手元のmcp-rsを起動するので、Rustの開発環境が無い人にも使えるようにする。
# Dockerのイメージ（deploy.yml）は、OSの資格情報ストア（os-keyring）を
# 含めないので、この使い方には向かない。
#
# deploy.ymlとは別のワークフローにする。deploy.ymlは1時間半ほどかかり、
# 同時に1つだけ動くので、その順番を待たずに作る。
#
# 署名はしない（#564で決めた）。止められたときの開き方と、SHA256での
# 確かめ方はREADMEに書く。
#
# 手動の実行（workflow_dispatch）と、このファイルを変えたPRでは、作るだけで、
# リリースには付けない（ワークフローの成果物として残る）。リリースの前に、
# 3つのOSで作れることを確かめるため
on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - '.github/workflows/release-binaries.yml'
      - 'packaging/mcpb/**'
  workflow_dispatch:

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# 作るジョブは読み取りだけにする。依存クレートのビルドスクリプトも動く
# ので、リリースに書く権限は、作ったものを付けるジョブだけに持たせる
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # glibcは、作ったOSの版以降でしか動かない。古い版でも動くよう、
          # 新しいubuntu-latestではなく22.04（glibc 2.35）で作る
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # 既定の機能（database・os-keyring）で作る。Cargo.lockのとおりに作る
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin mcp-rs

      - name: Package
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          # タグのときはタグ（v0.25.0）、ほかはコミット
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          set -euo pipefail
          name="mcp-rs-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          if [ "${TARGET}" = "x86_64-pc-windows-msvc" ]; then
            cp "target/${TARGET}/release/mcp-rs.exe" "dist/${name}/"
          else
            cp "target/${TARGET}/release/mcp-rs" "dist/${name}/"
          fi
          cp README.md README.ja.md LICENSE-MIT LICENSE-APACHE "dist/${name}/"
          cd dist
          if [ "${ARCHIVE}" = "zip" ]; then
            7z a -tzip "${name}.zip" "${name}" > /dev/null
            file="${name}.zip"
          else
            tar -czf "${name}.tar.gz" "${name}"
            file="${name}.tar.gz"
          fi
          # sha256sum -c・shasum -a 256 -cで確かめられる形（ハッシュ、空白2つ、名前）
          if command -v sha256sum > /dev/null; then
            sha256sum "${file}" > "${file}.sha256"
          else
            shasum -a 256 "${file}" > "${file}.sha256"
          fi
          cat "${file}.sha256"
          echo "file=${file}" >> "${GITHUB_OUTPUT}"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-rs-${{ matrix.target }}
          path: |
            dist/${{ steps.package.outputs.file }}
            dist/${{ steps.package.outputs.file }}.sha256
          if-no-files-found: error

  # Claude Desktopの拡張機能（MCP Bundle、`.mcpb`、#632）。3つのOSの実行
  # ファイルを1つにまとめる。署名はしない（#632で決めた）。SHA256と出所の
  # 証明は、ほかのファイルと同じく付ける
  mcpb:
    name: Claude Desktop extension (.mcpb)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mcp-rs-*
          path: dist
          merge-multiple: true

      - name: Assemble
        shell: bash
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          set -euo pipefail
          bundle=bundle
          mkdir -p "${bundle}/server/windows" "${bundle}/server/macos" "${bundle}/server/linux"
          unzip -q dist/*-x86_64-pc-windows-msvc.zip -d unpacked
          tar -xzf dist/*-aarch64-apple-darwin.tar.gz -C unpacked
          tar -xzf dist/*-x86_64-unknown-linux-gnu.tar.gz -C unpacked
          cp unpacked/*-x86_64-pc-windows-msvc/mcp-rs.exe "${bundle}/server/windows/"
          cp unpacked/*-aarch64-apple-darwin/mcp-rs "${bundle}/server/macos/"
          cp unpacked/*-x86_64-unknown-linux-gnu/mcp-rs "${bundle}/server/linux/"
          chmod +x "${bundle}/server/macos/mcp-rs" "${bundle}/server/linux/mcp-rs"
          cp packaging/mcpb/config.toml packaging/mcpb/icon.png LICENSE-MIT LICENSE-APACHE "${bundle}/"
          # 版は、タグ（v0.30.0 → 0.30.0）。タグでなければCargo.tomlの版
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${VERSION#v}"
          else
            version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          jq --arg v "${version}" '.version = $v' packaging/mcpb/manifest.json > "${bundle}/manifest.json"
          echo "name=mcp-rs-${VERSION}.mcpb" >> "${GITHUB_ENV}"

      # 公式のCLIで、manifest.jsonを確かめてから作る（版は固定する）
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @anthropic-ai/mcpb@2.1.2 validate bundle/manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack bundle "dist-mcpb/${name}"
          cd dist-mcpb
          sha256sum "${name}" > "${name}.sha256"
          cat "${name}.sha256"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-rs-mcpb
          path: dist-mcpb/*
          if-no-files-found: error

  # 作ったものを、タグのGitHubのリリースに付ける。リリースは、タグを付けた
  # 後に手で作る（deploy.ymlのSBOMと同じ）。まだ無ければ、30分まで待つ
  publish:
    name: Attach to release
    needs: [build, mcpb]
    # タグのpushのときだけ。手動の実行でタグを選んでも、公開済みのリリースの
    # ファイルを置き換えない（#717。`--clobber`で置き換えていた）
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 出所の証明（attestation）を作るため（#599）
      id-token: write
      attestations: write
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mcp-rs-*
          path: dist
          merge-multiple: true

      - name: Wait for the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if gh release view "${TAG}" > /dev/null 2>&1; then
              exit 0
            fi
            echo "Waiting for the GitHub release ${TAG} (${i}/60)"
            sleep 30
          done
          echo "::error::No GitHub release for ${TAG} after 30 minutes. Create it, then re-run this job"
          exit 1

      # リリースにすでにあるファイルは、置き換えない（#809）。作り直した
      # ファイルは、中身が同じでもハッシュが変わる（`.mcpb`・`.zip`は時刻を
      # 入れる）。置き換えると、MCP Registryに登録した`.mcpb`の`fileSha256`や、
      # 前に作った出所の証明と合わなくなる。ジョブをやり直したときは、無い
      # ファイルだけを足す。リリースにあるファイルは、そのファイルから
      # `.sha256`を作り直し、`SHA256SUMS`に入れる
      - name: Keep the files already on the release
        id: keep
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          # new: リリースに足すファイル、attest: そのうちの配るファイル、
          # replace: 同じ名前のものを置き換えて上げるファイル
          mkdir -p ../new ../attest ../replace ../release
          # 上げ終わったファイル（`state`が`uploaded`）だけを、リリースにある
          # ものとする。上げるのに失敗すると、中身の無いもの（`starter`）が
          # 残ることがある（PR #818のレビュー）
          uploaded=$(gh release view "${TAG}" --json assets --jq '.assets[] | select(.state == "uploaded") | .name')
          listed=$(gh release view "${TAG}" --json assets --jq '.assets[].name')
          has() { printf '%s\n' "${uploaded}" | grep -Fxq -- "$1"; }
          # 上げるファイルを置く。同じ名前のもの（上げ終わっていないもの・配る
          # ファイルが無いのに残っていた`.sha256`）があれば、置き換える
          put() {
            if printf '%s\n' "${listed}" | grep -Fxq -- "$1"; then
              echo "$1 is on the release but is not a file that is handed out: replacing it"
              cp "$1" ../replace/
            else
              cp "$1" ../new/
            fi
          }
          for file in *.zip *.tar.gz *.mcpb; do
            if has "${file}"; then
              echo "${file} is already on the release: keeping it"
              gh release download "${TAG}" -p "${file}" -D ../release --clobber
              mv "../release/${file}" "${file}"
              sha256sum "${file}" > "${file}.sha256"
              if has "${file}.sha256"; then
                gh release download "${TAG}" -p "${file}.sha256" -D ../release --clobber
                # ハッシュだけを比べる（Windowsで作ったものは、名前の前に`*`が付く）
                if [ "$(cut -d ' ' -f 1 "../release/${file}.sha256")" != "$(cut -d ' ' -f 1 "${file}.sha256")" ]; then
                  echo "::error::${file}.sha256 on the release does not match ${file} on the release. Fix the release by hand"
                  exit 1
                fi
                # リリースの`.sha256`を、そのまま`SHA256SUMS`に入れる
                cp "../release/${file}.sha256" "${file}.sha256"
              else
                put "${file}.sha256"
              fi
            else
              put "${file}"
              cp "${file}" ../attest/
              # 配るファイルが無いのに`.sha256`だけがあれば（前の実行が途中で
              # 止まった等）、それは配っているファイルのハッシュではないので、
              # 置き換える（PR #818のレビュー。足すだけだと、同じ名前で失敗する）
              put "${file}.sha256"
            fi
          done
          # 全部のハッシュを1つにまとめたもの（sha256sum -c SHA256SUMSで確かめる）
          cat ./*.sha256 > SHA256SUMS
          cat SHA256SUMS
          for dir in new replace; do
            if compgen -G "../${dir}/*" > /dev/null; then
              echo "${dir}=true" >> "${GITHUB_OUTPUT}"
            else
              echo "${dir}=false" >> "${GITHUB_OUTPUT}"
            fi
          done
          if compgen -G '../attest/*' > /dev/null; then
            echo "built=true" >> "${GITHUB_OUTPUT}"
          else
            echo "built=false" >> "${GITHUB_OUTPUT}"
          fi

      # 配るファイルが、このリポジトリのこのワークフローで作られたことの
      # 証明（#599）。`.sha256`は同じリリースから取るので、リリースの
      # ファイルを差し替えられる人には効かない。証明は、GitHubが署名して
      # 別に保つので、`gh attestation verify`で確かめられる。リリースに
      # 足すファイルだけを証明する（すでにあるものは、前の実行で証明した）
      - name: Attest build provenance
        if: steps.keep.outputs.built == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: attest/*

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NEW: ${{ steps.keep.outputs.new }}
          REPLACE: ${{ steps.keep.outputs.replace }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 同じ名前のもの（上げ終わっていないもの・配るファイルが無いのに
          # 残っていた`.sha256`）を、足す前に置き換える（PR #818のレビュー。
          # 後にすると、置き換えに失敗したとき、新しいファイルと古い`.sha256`が
          # 残り、やり直しでも直らない。先なら、失敗しても配るファイルはまだ
          # 上げ終わっていないので、やり直しで同じく置き換える）
          # `.sha256`を先に、1つずつ置き換える（PR #818のレビュー。まとめて
          # 上げると、`gh`はファイルごとに並べて置き換えるので、`.sha256`だけが
          # 古いまま残りうる）。配るファイルの置き換えが途中で失敗しても、
          # 上げ終わっていないので、やり直しで両方を置き換える
          if [ "${REPLACE}" = "true" ]; then
            for f in replace/*.sha256; do
              gh release upload "${TAG}" "${f}" --clobber
            done
            for f in replace/*; do
              case "${f}" in
                *.sha256) ;;
                *) gh release upload "${TAG}" "${f}" --clobber ;;
              esac
            done
          fi
          # 無いファイルだけを足す（`--clobber`を付けない。#809）。途中で
          # 失敗しても、やり直しでは、上がったファイルを使い続け、残りを足す
          if [ "${NEW}" = "true" ]; then
            gh release upload "${TAG}" new/*
          fi
          # `SHA256SUMS`は、リリースのファイルから作り直したものなので、
          # 置き換えてよい
          gh release upload "${TAG}" dist/SHA256SUMS --clobber

  # リリースに付けた`.mcpb`を、公式のMCP Registryに登録する（#668）
  registry:
    name: MCP Registry
    needs: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
    with:
      tag: ${{ github.ref_name }}
