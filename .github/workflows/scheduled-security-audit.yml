name: Scheduled Security Audit

# push/PR時のcargo audit（ci.yml）だけでは、マージ済みの依存関係に後から
# 開示された脆弱性は次のpush/PRまで検知されない。毎日Cargo.lockを監査し、
# 検知したらジョブを失敗させてIssueで知らせる。
#
# scheduleはデフォルトブランチ（develop）でしか起動しないため、リリース
# 済みのmainのCargo.lockもマトリクスで明示的にチェックアウトして監査する。
#
# Issueはブランチごとに1件だけ開いておき、検知内容（アドバイザリID・
# パッケージ・バージョンの集合）が前回の報告から変わったときだけコメント
# する。修正版のないアドバイザリが残っていても毎日同じコメントが積み上がら
# ないようにするため。監査がクリーンに戻ったらIssueを閉じる（再発時は新しい
# Issueとして報告される）。対応しないと判断したアドバイザリは
# .cargo/audit.tomlのignoreに追加する。
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cargo-audit:
    name: cargo audit (${{ matrix.ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ref: [develop, main]
    concurrency:
      group: scheduled-security-audit-${{ matrix.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AUDIT_REF: ${{ matrix.ref }}
      ISSUE_LABEL: cargo-audit-scheduled
      ISSUE_TITLE: '[定期監査] cargo auditで依存関係の問題を検知（${{ matrix.ref }}）'
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # 無視するアドバイザリは各ブランチの.cargo/audit.tomlに集約されている
      - name: Run cargo audit
        id: audit
        run: |
          if cargo audit --json > audit.json; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 脆弱性の検知と、アドバイザリDBの取得失敗等による監査自体の
          # 失敗を区別する
          if jq -e '.vulnerabilities.found == true' audit.json > /dev/null 2>&1; then
            echo "result=vulnerable" >> "$GITHUB_OUTPUT"
          else
            echo "result=error" >> "$GITHUB_OUTPUT"
          fi

      - name: Find open issue
        id: issue
        run: |
          number=$(gh issue list --state open --label "$ISSUE_LABEL" --limit 100 \
            --json number,title --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" | head -n1)
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Close issue when clean
        if: steps.audit.outputs.result == 'clean' && steps.issue.outputs.number != ''
        env:
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue close "$NUMBER" --comment "定期監査で問題が検知されなくなったため閉じます（${AUDIT_REF}）。実行ログ: ${RUN_URL}"

      - name: Report to issue
        if: steps.audit.outputs.result != 'clean'
        env:
          RESULT: ${{ steps.audit.outputs.result }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          if [ "$RESULT" = "vulnerable" ]; then
            ids=$(jq -r '[.vulnerabilities.list[] | "\(.advisory.id)@\(.package.name)@\(.package.version)"] | unique | join(",")' audit.json)
          else
            ids=error
          fi

          {
            if [ "$RESULT" = "vulnerable" ]; then
              echo "定期実行の\`cargo audit\`で依存関係の脆弱性を検知しました（${AUDIT_REF}）。"
              echo
              echo "検知件数: $(jq '.vulnerabilities.count' audit.json)"
              echo
              jq -r '.vulnerabilities.list[] | "- [\(.advisory.id)](https://rustsec.org/advisories/\(.advisory.id)) `\(.package.name)` \(.package.version): \(.advisory.title)"' audit.json
            else
              echo "定期実行の\`cargo audit\`の実行自体に失敗しました（${AUDIT_REF}）。アドバイザリDBの取得失敗等が考えられます。"
            fi
            echo
            echo "実行ログ: ${RUN_URL}"
            echo
            echo "<!-- audit-ids: ${ids} -->"
          } > report.md

          if [ -z "$NUMBER" ]; then
            gh label create "$ISSUE_LABEL" --color B60205 \
              --description "定期実行のcargo auditが検知した問題" --force
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --label security \
              --body-file report.md
            exit 0
          fi

          # 一時的な監査失敗（error）を挟んでも、同じ脆弱性を再報告しない
          # よう、脆弱性の報告は直近の脆弱性マーカーと比較する
          if [ "$RESULT" = "vulnerable" ]; then
            filter='map(select(. != "error"))'
          else
            filter='.'
          fi
          last_ids=$(gh issue view "$NUMBER" --json body,comments \
            --jq "[.body, .comments[].body] | map(capture(\"<!-- audit-ids: (?<ids>[^ ]*) -->\").ids) | ${filter} | last // \"\"")

          if [ "$last_ids" = "$ids" ]; then
            echo "Findings unchanged since last report on #${NUMBER}; not commenting again."
          else
            gh issue comment "$NUMBER" --body-file report.md
          fi

      - name: Fail the run
        if: steps.audit.outputs.result != 'clean'
        env:
          RESULT: ${{ steps.audit.outputs.result }}
        run: |
          if [ "$RESULT" = "vulnerable" ]; then
            echo "::error::cargo audit detected vulnerabilities on ${AUDIT_REF}. See the issue labeled ${ISSUE_LABEL}."
          else
            echo "::error::cargo audit itself failed to run on ${AUDIT_REF}. See the log above."
          fi
          exit 1
