---
name: Release Image

# リリースのDockerイメージを作るワークフロー。検証（fmt・clippy・テスト・
# 監査）の後、イメージを作ってghcr.ioに送り、SBOMを作り（タグのときは
# GitHubのリリースに添付）、イメージをTrivyでスキャンする。
# どこかのサーバーへのデプロイはしない（デプロイ先が無いため、中身が
# echoだけだったstaging・production・rollbackのジョブは削除した、#451）
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# 1回の実行に1時間半ほどかかり、mainへのpushとタグのpushの両方で動く。
# 並行して共有のイメージのタグ（main・latest・0.19・0等）を上書きしない
# よう、同時には1つだけ実行する。実行中のものは取り消さず、後の実行は
# 終わるのを待つ（#445）。GitHub Actionsの仕様で、待てるのは1件だけ。
# 待っている実行があるときに次の実行が来ると、待っていたほうは取り消される
concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_TERM_COLOR: always

jobs:
  # Build and test before building the image
  pre-deployment-checks:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Rustのビルドのキャッシュは使わない（#515）。このワークフローはmainと
      # タグでだけ動くので、保存してもそのrefの次のリリースまで使われず、
      # キャッシュの容量を圧迫するだけだった。keyもcontainer-integration-tests
      # と同じ（Linux-cargo-<Cargo.lockのハッシュ>）で衝突していた

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        # double_must_use is allowed because async_trait's macro expansion attaches an
        # unannotated #[must_use] to methods that already return a #[must_use] Result,
        # which newer clippy versions flag as a false positive.
        run: cargo clippy --all-features -- -D warnings -A clippy::double_must_use

      - name: Run tests
        run: cargo test --lib --all-features

      - name: Security audit
        run: |
          cargo install cargo-audit
          cargo audit --ignore RUSTSEC-2023-0071

  # Build Docker image
  build-docker-image:
    name: Build Docker Image
    needs: pre-deployment-checks
    runs-on: ubuntu-latest
    permissions:
      # write is required so the SBOM step below can attach sbom.spdx.json
      # to the matching GitHub Release (upload-release-assets: true)
      contents: write
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' }}
          # latestは、vX.Y.Zタグのときにtype=semverが自動で付ける（flavorの
          # latest=auto）。既定のブランチ（develop）にlatestを付ける行は
          # 置かない。手動の実行でリリース前のイメージがlatestになるため（#482）

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # developのdocker-security.ymlが保存したキャッシュを読むだけにする。
          # mainとタグに保存したものは、ほかの実行から読めないため（#515）
          cache-from: type=gha
          platforms: linux/amd64,linux/arm64

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  # Container security scanning
  security-scan:
    name: Container Security Scan
    needs: build-docker-image
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-docker-image.outputs.image-digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
