name: ✨ Feature Request
description: 新機能や改善の提案
title: "[FEATURE] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        # ✨ Feature Request
        
        新機能や改善のご提案をありがとうございます。
        ご提案の詳細をお聞かせください。

  - type: dropdown
    id: category
    attributes:
      label: 📂 カテゴリ
      description: どのカテゴリの機能ですか？
      options:
        - "WordPress Tools"
        - "Security Enhancement"
        - "Plugin System"
        - "Performance"
        - "Documentation"
        - "Developer Experience"
        - "その他"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 🎯 解決したい問題
      description: この機能によってどのような問題を解決したいですか？
      placeholder: |
        現在の制限や不便な点について説明してください。
        具体的なユースケースがあれば教えてください。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💡 提案する解決策
      description: どのような機能や改善を提案しますか？
      placeholder: |
        具体的な機能の説明、APIの例、UI/UXの改善案など
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 代替案
      description: 他に考えられる解決方法はありますか？

  - type: textarea
    id: benefits
    attributes:
      label: ✅ 期待される効果
      description: この機能により得られる効果や価値
      placeholder: |
        - ユーザビリティの向上
        - パフォーマンスの改善
        - セキュリティの強化
        - 開発効率の向上
        など

  - type: checkboxes
    id: implementation
    attributes:
      label: 🛠️ 実装への協力
      description: この機能の実装にご協力いただけますか？
      options:
        - label: "実装に協力できます"
          required: false
        - label: "テストに協力できます"
          required: false
        - label: "ドキュメント作成に協力できます"
          required: false
        - label: "レビューに協力できます"
          required: false